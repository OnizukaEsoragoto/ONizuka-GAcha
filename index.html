<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Onitsuka 的专属扭蛋机</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #fce4ec; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; overflow: hidden; }
        
        /* 兑换码区域 */
        .header { margin-bottom: 20px; text-align: center; background: white; padding: 15px 30px; border-radius: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .header input { padding: 8px; border: 2px solid #ff8a80; border-radius: 8px; outline: none; }
        .header button { padding: 8px 15px; background: #ff5252; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; }
        .header button:hover { background: #ff1744; }

        /* 扭蛋机主体 */
        .machine { width: 300px; height: 450px; background: #ff5252; border-radius: 30px 30px 10px 10px; position: relative; box-shadow: 0 10px 20px rgba(0,0,0,0.2); border: 5px solid #d50000; }
        .machine-top { width: 100%; height: 80px; background: #ff1744; border-radius: 25px 25px 0 0; display: flex; justify-content: center; align-items: center; color: white; font-size: 24px; font-weight: bold; text-shadow: 2px 2px #d50000; }
        
        /* 玻璃橱窗 */
        .glass { width: 260px; height: 200px; background: rgba(224, 247, 250, 0.8); margin: 10px auto; border-radius: 15px; border: 3px solid #b0bec5; position: relative; overflow: hidden; }
        /* 橱窗里的假扭蛋 */
        .bg-capsule { width: 40px; height: 40px; background: linear-gradient(to bottom, #ffeb3b 50%, white 50%); border-radius: 50%; position: absolute; border: 2px solid #ccc; }
        .c1 { top: 130px; left: 30px; transform: rotate(20deg); background: linear-gradient(to bottom, #2196f3 50%, white 50%); }
        .c2 { top: 140px; left: 90px; transform: rotate(-15deg); background: linear-gradient(to bottom, #4caf50 50%, white 50%); }
        .c3 { top: 120px; left: 150px; transform: rotate(45deg); background: linear-gradient(to bottom, #e91e63 50%, white 50%); }
        .c4 { top: 145px; left: 200px; transform: rotate(-30deg); }

        /* 掉落的扭蛋 (隐藏状态) */
        .falling-capsule { width: 50px; height: 50px; background: linear-gradient(to bottom, gold 50%, white 50%); border-radius: 50%; position: absolute; border: 2px solid #ccc; left: 125px; top: -60px; z-index: 10; display: none; }

        /* 旋钮与出口 */
        .controls { display: flex; justify-content: space-between; padding: 20px 40px; align-items: center; }
        .crank-wrapper { position: relative; cursor: pointer; }
        .crank-bg { width: 60px; height: 60px; background: #eee; border-radius: 50%; border: 3px solid #9e9e9e; display: flex; justify-content: center; align-items: center; }
        .crank-handle { width: 15px; height: 45px; background: #616161; border-radius: 5px; transition: transform 0.5s ease-in-out; }
        
        .chute { width: 70px; height: 60px; background: #212121; border-radius: 10px 10px 30px 30px; position: relative; overflow: hidden; border: 3px solid #424242; }

        /* 动画关键帧 */
        @keyframes turnCrank { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        @keyframes dropCapsule { 
            0% { top: 50px; display: block; opacity: 1; } 
            50% { top: 210px; } 
            70% { top: 190px; } /* 弹跳一下 */
            100% { top: 220px; opacity: 0; } /* 掉进出口并消失 */
        }

        /* 结果弹窗 */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); justify-content: center; align-items: center; z-index: 100; flex-direction: column; }
        .card { width: 300px; background: white; padding: 20px; border-radius: 15px; text-align: center; box-shadow: 0 0 30px rgba(255,215,0,0.5); position: relative; transform: scale(0); transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        .card.show { transform: scale(1); }
        .card h2 { margin: 0 0 10px 0; font-size: 28px; }
        .card .img-placeholder { width: 100%; height: 200px; background: #eee; border-radius: 10px; margin-bottom: 15px; display: flex; justify-content: center; align-items: center; color: #888; font-style: italic; }
        .card p { margin: 5px 0; font-size: 16px; color: #333; }
        .hash-code { font-size: 12px; color: #666; background: #f5f5f5; padding: 8px; border-radius: 5px; margin-top: 15px; word-break: break-all; font-family: monospace; border: 1px dashed #ccc; }
        .close-btn { margin-top: 20px; padding: 10px 20px; background: #ff5252; color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 16px; }
    </style>
</head>
<body>

<!-- 兑换成功专属弹窗 -->
<div class="modal" id="redeem-modal">
    <div class="card" id="redeem-card">
        <h2 style="color: #ff5252; margin-bottom: 5px;">兑换成功！</h2>
        <!-- 这里可以放你画的提示卡面图片，比如手绘的扭蛋币/兑换卡 -->
        <div class="img-placeholder" id="redeem-img" style="height: 140px; background: #fff3e0; border: 2px dashed #ffb74d;">
            🎨 兑换卡面 / 扭蛋币图案<br>(后期替换图片)
        </div>
        <p id="redeem-msg" style="font-size: 18px; font-weight: bold; color: #333;">获得 10 次扭蛋机会！</p>
        <p style="font-size: 13px; color: #888;">快去投币扭动旋钮试试手气吧~</p>
        <button class="close-btn" onclick="closeRedeemModal()" style="margin-top: 15px;">开心收下</button>
    </div>
</div>

    <div class="header">
        <div>剩余抽卡次数: <span id="coin-count" style="color:#ff5252; font-weight:bold; font-size: 20px;">0</span></div>
        <div style="margin-top: 10px;">
            <input type="text" id="redeem-code" placeholder="输入兑换码 (测试: ONITSUKA2026)">
            <button onclick="redeem()">兑换</button>
        </div>
    </div>

    <div class="machine">
        <div class="machine-top">Gacha!</div>
        <div class="glass">
            <div class="bg-capsule c1"></div>
            <div class="bg-capsule c2"></div>
            <div class="bg-capsule c3"></div>
            <div class="bg-capsule c4"></div>
            <div class="falling-capsule" id="falling-capsule"></div>
        </div>
        <div class="controls">
            <div class="crank-wrapper" onclick="draw()">
                <div class="crank-bg">
                    <div class="crank-handle" id="crank"></div>
                </div>
                <div style="text-align: center; font-size: 12px; color: white; margin-top: 5px;">点击扭一下</div>
            </div>
            <div class="chute"></div>
        </div>
    </div>

    <!-- 结果弹窗 -->
    <div class="modal" id="modal">
        <div class="card" id="prize-card">
            <h2 id="prize-rank">SSR</h2>
            <div class="img-placeholder" id="prize-img">这里放你画的美图<br>(后期替换)</div>
            <p id="prize-name" style="font-weight:bold; font-size:18px;">豪华定制插画</p>
            <div class="hash-code" id="hash-code">防伪码: 生成中...</div>
            <button class="close-btn" onclick="closeModal()">收下奖品</button>
        </div>
    </div>

    <script>
        let coins = 0;
        let isDrawing = false;

        // 奖池配置 (测试用)
        const prizePool = [
            { rank: 'SSR', name: '精细全身立绘插画', chance: 0.05, color: '#ffca28' }, // 5%
            { rank: 'SR', name: '半身精致涂鸦', chance: 0.20, color: '#ce93d8' }, // 20%
            { rank: 'R', name: '单人Q版头像', chance: 0.75, color: '#90caf9' } // 75%
        ];

        // 更新次数显示
        function updateCoinDisplay() {
            document.getElementById('coin-count').innerText = coins;
        }

        // 兑换码功能
        function redeem() {
            const code = document.getElementById('redeem-code').value.trim();
            
            if (code === 'ONITSUKA2026') {
                const addedCoins = 10;
                coins += addedCoins;
                updateCoinDisplay();
                
                document.getElementById('redeem-msg').innerText = `成功解锁 ${addedCoins} 次扭蛋次数！`;
                showRedeemModal();
                document.getElementById('redeem-code').value = '';
            } else {
                showRedeemModal('兑换码无效或已使用！', 'error');
            }
        }

        // 显示兑换弹窗
        function showRedeemModal(customText, type = 'success') {
            const modal = document.getElementById('redeem-modal');
            const card = document.getElementById('redeem-card');
            
            if (type === 'error') {
                document.getElementById('redeem-msg').innerText = customText || '兑换码无效！';
            }
            
            modal.style.display = 'flex';
            setTimeout(() => card.classList.add('show'), 10);
        }

        // 关闭兑换弹窗
        function closeRedeemModal() {
            const card = document.getElementById('redeem-card');
            card.classList.remove('show');
            setTimeout(() => {
                document.getElementById('redeem-modal').style.display = 'none';
            }, 300);
        }

        // 抽卡主逻辑
        function draw() {
            if (isDrawing) return;
            if (coins <= 0) {
                showRedeemModal('没有抽卡次数啦！请先在上方输入兑换码。', 'error');
                return;
            }

            isDrawing = true;
            coins--;
            updateCoinDisplay();

            // 1. 播放旋钮动画
            const crank = document.getElementById('crank');
            crank.style.animation = "turnCrank 0.6s ease-out";

            // 2. 播放扭蛋掉落动画
            setTimeout(() => {
                const capsule = document.getElementById('falling-capsule');
                capsule.style.display = 'block';
                capsule.style.animation = "dropCapsule 1s forwards";
            }, 500);

            // 3. 计算抽奖结果
            const result = getPrize();

            // 4. 动画结束后弹出结果
            setTimeout(() => {
                showModal(result);
                // 重置动画状态
                crank.style.animation = "";
                document.getElementById('falling-capsule').style.animation = "";
                document.getElementById('falling-capsule').style.display = 'none';
                isDrawing = false;
            }, 1500);
        }

        // 概率计算
        function getPrize() {
            const rand = Math.random(); // 0 到 1 之间的随机数
            let cumulative = 0;
            for (let prize of prizePool) {
                cumulative += prize.chance;
                if (rand < cumulative) {
                    return prize;
                }
            }
            return prizePool[prizePool.length - 1]; // 保底R卡
        }

        // 弹窗与防伪码生成
        function showModal(prize) {
            const modal = document.getElementById('modal');
            const card = document.getElementById('prize-card');
            
            document.getElementById('prize-rank').innerText = prize.rank;
            document.getElementById('prize-rank').style.color = prize.color;
            document.getElementById('prize-name').innerText = prize.name;
            
            // 生成防伪码
            const timestamp = Date.now().toString(36).toUpperCase();
            const randomHash = Math.random().toString(36).substring(2, 6).toUpperCase();
            const fullCode = `ONI-${prize.rank}-${timestamp}-${randomHash}`;
            
            document.getElementById('hash-code').innerText = `凭证码: ${fullCode}\n(请截图保存此画面找画师约稿)`;

            modal.style.display = 'flex';
            setTimeout(() => card.classList.add('show'), 10);
        }

        function closeModal() {
            document.getElementById('prize-card').classList.remove('show');
            setTimeout(() => {
                document.getElementById('modal').style.display = 'none';
            }, 300);
        }
    </script>
</body>
</html>
