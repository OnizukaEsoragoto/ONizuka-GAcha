<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Onitsuka 扭蛋后台管理</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #181825; color: #cdd6f4; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 90vh; margin: 0; }
        .box { background: #1e1e2e; padding: 25px; border-radius: 16px; width: 100%; max-width: 400px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); border: 1px solid #313244; }
        h2 { margin-top: 0; color: #f38ba8; text-align: center; }
        label { display: block; margin-top: 15px; font-size: 14px; color: #a6adc8; }
        input, button { width: 100%; padding: 12px; margin-top: 8px; border-radius: 8px; border: 1px solid #45475a; box-sizing: border-box; font-size: 14px; }
        input { background: #313244; color: #fff; outline: none; }
        input:focus { border-color: #f38ba8; }
        button { background: #f38ba8; color: #11111b; font-weight: bold; cursor: pointer; border: none; margin-top: 20px; transition: 0.2s; }
        button:hover { background: #f5e0dc; }
        .result { margin-top: 20px; padding: 12px; background: #11111b; border-radius: 8px; font-family: monospace; word-break: break-all; font-size: 13px; color: #a6e3a1; white-space: pre-wrap; }
    </style>
</head>
<body>
    <div class="box">
        <h2>🎨 卡密生成后台</h2>
        <label>GitHub Token (保存在本地浏览器):</label>
        <input type="password" id="gh-token" placeholder="贴入 ghp_ 开头的 Token">
        
        <label>自定义兑换码 (留空将自动生成):</label>
        <input type="text" id="custom-code" placeholder="例如: ONI-VIP888">
        
        <label>允许兑换次数:</label>
        <input type="number" id="code-uses" value="1" min="1">
        
        <button onclick="addCode()">生成并保存到云端</button>
        <div class="result" id="status">状态: 就绪</div>
    </div>

    <script>
        // 自动读取上次保存的 Token
        document.getElementById('gh-token').value = localStorage.getItem('oni_gh_token') || '';

        async function addCode() {
            const token = document.getElementById('gh-token').value.trim();
            let code = document.getElementById('custom-code').value.trim().toUpperCase();
            const uses = parseInt(document.getElementById('code-uses').value) || 1;
            const status = document.getElementById('status');

            if (!token) { alert('请先贴入你的 GitHub Token！'); return; }
            localStorage.setItem('oni_gh_token', token);

            // 如果没填兑换码，自动生成一个随机码
            if (!code) {
                code = 'ONI-' + Math.random().toString(36).substring(2, 6).toUpperCase();
            }

            status.innerText = "⏳ 正在同步写入 GitHub...";

            const owner = "OnizukaEsoragoto"; 
            const repo = "ONizuka-GAcha";
            const path = "codes.json";
            const url = `https://api.github.com/repos/${owner}/${repo}/contents/${path}`;

            try {
                // 1. 获取原 JSON 数据
                const res = await fetch(url, { headers: { Authorization: `token ${token}` } });
                const data = await res.json();
                const sha = data.sha;
                
                // 解码 Base64 内容
                const currentCodes = JSON.parse(decodeURIComponent(escape(atob(data.content))));

                // 2. 写入新卡密与次数
                currentCodes[code] = uses;

                // 3. 重新编码并提交回 GitHub
                const updatedContent = btoa(unescape(encodeURIComponent(JSON.stringify(currentCodes, null, 2))));
                const updateRes = await fetch(url, {
                    method: 'PUT',
                    headers: {
                        Authorization: `token ${token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        message: `[Auto] 生成兑换码: ${code}`,
                        content: updatedContent,
                        sha: sha
                    })
                });

                if (updateRes.ok) {
                    status.innerText = `✅ 生成成功！已写入 GitHub\n----------------------\n兑换码: ${code}\n可用次数: ${uses} 次`;
                    navigator.clipboard.writeText(code);
                } else {
                    status.innerText = "❌ 保存失败！请检查 Token 是否勾选了 repo 权限。";
                }
            } catch (err) {
                status.innerText = "❌ 发生错误: " + err.message;
            }
        }
    </script>
</body>
</html>
